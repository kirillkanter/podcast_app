# Тесты и сборка: APK для Android и папка с программой для Windows.
# Запускается при каждом изменении кода и вручную (вкладка Actions → Run workflow).
name: build

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Платформенные файлы
        run: flutter create --platforms=android,windows --project-name podcast_app .
      - run: flutter pub get
      - name: Генерация кода БД
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Анализ кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Тесты
        run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --project-name podcast_app .
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: podcast_app-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --project-name podcast_app .
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: podcast_app-windows
          path: build/windows/x64/runner/Release/
