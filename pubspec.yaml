name: podcast_app
description: Basic Caster — подкаст-плеер для Android и Windows.
publish_to: none
version: 0.6.0+8

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  http: ^1.2.0
  just_audio: ^0.10.6
  # Windows-реализация just_audio. Берём из репозитория: в опубликованной 0.2.3
  # нет исправлений сентября 2026 и плеер сам захватывает системные медиа-кнопки,
  # из-за чего кнопки на клавиатуре рассинхронизируют интерфейс.
  just_audio_windows:
    git:
      url: https://github.com/bdlukaa/just_audio_windows.git
      path: just_audio_windows
      ref: 501f2ddddf2cdd9241213bcdaf05227a6c6a7c10
  # Фоновое воспроизведение, уведомление и экран блокировки на Android.
  audio_service: ^0.18.19
  # audio_service на Windows: системная панель мультимедиа и медиа-клавиши.
  audio_service_win: ^0.0.3
  audio_session: ">=0.1.24 <0.3.0"
  # Тип сети для автозагрузки только по Wi-Fi.
  connectivity_plus: ">=6.1.0 <8.0.0"
  path: ^1.9.0
  path_provider: ^2.1.0
  # 7.x требует Dart 3.13; диапазон позволяет pub выбрать версию под ваш Flutter.
  xml: ">=6.6.1 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  # Для теста плеера с поддельной аудиоплатформой.
  just_audio_platform_interface: ^4.6.0
  plugin_platform_interface: ^2.0.0

flutter:
  uses-material-design: true
