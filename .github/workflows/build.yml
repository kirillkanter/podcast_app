# Тесты и сборка: APK для Android и папка с программой для Windows.
# Запускается при каждом изменении кода и вручную (вкладка Actions → Run workflow).
name: build

on:
  push:
  workflow_dispatch:

# Новый push отменяет незавершённую сборку той же ветки.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Платформенные файлы
        run: flutter create --platforms=android,windows --project-name podcast_app .
      - run: flutter pub get
      - name: Генерация кода БД
        run: bash tool/ci_run.sh 'Ошибка генерации кода' dart run build_runner build --delete-conflicting-outputs
      - name: Анализ кода
        shell: bash
        run: tool/ci_run.sh 'Ошибки анализа кода' flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: PHP для сервера синхронизации
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3
      - name: Запуск oPodSync для интеграционного теста
        shell: bash
        run: |
          mkdir -p /tmp/opodsync-data
          export DATA_ROOT=/tmp/opodsync-data
          nohup php -S 127.0.0.1:8085 -t sync-server/server sync-server/server/index.php > /tmp/opodsync.log 2>&1 &
          sleep 2
          php -r 'namespace OPodSync; $_SERVER["SERVER_NAME"] = "127.0.0.1"; $_SERVER["SERVER_PORT"] = 8085;
            require "sync-server/server/_inc.php";
            $e = $gpodder->subscribe("citest", "citest-password-123");
            if ($e) { fwrite(STDERR, "subscribe: $e\n"); exit(1); }
            echo "Пользователь создан\n";'
          curl -s -o /dev/null -w "Страница сервера: %{http_code}\n" http://127.0.0.1:8085/
      - name: Тесты
        env:
          OPODSYNC_URL: http://127.0.0.1:8085
          OPODSYNC_USER: citest
          OPODSYNC_PASSWORD: citest-password-123
        shell: bash
        run: |
          # Подробности упавших тестов выводятся аннотацией к запуску:
          # её видно на странице Actions и через API.
          if ! timeout 600 flutter test --reporter expanded --timeout 60s > test.log 2>&1; then
            cat test.log
            # Конец лога: видно, на каком тесте всё остановилось.
            tail_log=$(tail -25 test.log | cut -c1-300 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Конец лога тестов::${tail_log}"
            # Только упавшие тесты: строки с [E], блоки исключений и ожиданий,
            # без строк прогресса прошедших тестов (иначе аннотация обрезается).
            grep -E -A14 '\[E\]|EXCEPTION CAUGHT|Expected:|Error:|Exception:|relevant error-causing widget|^#[0-9]+ .*(file://|package:podcast_app)' test.log \
              | grep -v -E '^[0-9]{2}:[0-9]{2} \+[0-9]+( -[0-9]+)?: [^[]*$' \
              | grep -v -E '^#[0-9]+ .*(package:flutter|package:matcher|package:stack_trace|dart:)|^\s+package:flutter|dart:async|stack_trace' \
              | head -200 > fail.txt || true
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' fail.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Упавшие тесты::${msg}"
            if [ -s /tmp/opodsync.log ]; then
              log=$(tail -40 /tmp/opodsync.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::warning title=Лог oPodSync::${log}"
            fi
            exit 1
          fi
          tail -3 test.log
          # Итог и строка интеграционного теста — в заметку к запуску.
          summary=$(tail -1 test.log)
          integration=$(grep -E 'oPodSync: вход' test.log | tail -1 | sed -e 's/%/%25/g')
          echo "::notice title=Тесты::${summary}%0A${integration}"

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --project-name podcast_app .
      - name: Правка AndroidManifest (интернет, http, фоновое аудио, название)
        run: |
          dart run tool/patch_platforms.dart
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml
          grep -rq 'AudioServiceActivity()' android/app/src/main/kotlin
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' android/app/src/main/AndroidManifest.xml
          grep -q 'com.ryanheise.audioservice.AudioService"' android/app/src/main/AndroidManifest.xml
          grep -q 'com.ryanheise.audioservice.MediaButtonReceiver' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable-xxhdpi/ic_stat_bcaster.png
          cmp tool/android/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          grep -q 'applicationId = "ru.bcaster.app"' android/app/build.gradle.kts
          grep -q 'BCASTER_KEYSTORE' android/app/build.gradle.kts
          # Итоговый манифест — в лог сборки.
          cat android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: bash tool/ci_run.sh 'Ошибка генерации кода' dart run build_runner build --delete-conflicting-outputs
      - name: Ключ подписи
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning title=Нет ключа подписи::Секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS не заданы — APK подписан временным ключом и не обновится поверх установленного."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BCASTER_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "BCASTER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BCASTER_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
      - name: Сборка APK
        shell: bash
        run: tool/ci_run.sh 'Ошибка сборки Android' flutter build apk --release
      - name: Проверка подписи
        shell: bash
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs"
          if [ -n "$BCASTER_KEYSTORE" ]; then
            if echo "$certs" | grep -qi "SHA-256 digest: $RELEASE_CERT_SHA256"; then
              echo "::notice title=Подпись::APK подписан постоянным ключом Basic Caster."
            else
              echo "::error title=Подпись::APK подписан не тем ключом: отпечаток не совпадает."
              exit 1
            fi
          fi
        env:
          RELEASE_CERT_SHA256: 0b2334f9c4e8c34f97efdfa2f75cdfee7bb5d85e9623161c16388527978f0559
      - uses: actions/upload-artifact@v4
        with:
          name: podcast_app-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --project-name podcast_app .
      - name: Правка windows/CMakeLists.txt (совместимость плагинов с MSVC)
        shell: bash
        run: |
          dart run tool/patch_platforms.dart
          grep -q '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS' windows/CMakeLists.txt
          grep -q 'WM_GETMINMAXINFO' windows/runner/win32_window.cpp
          cmp tool/windows/app_icon.ico windows/runner/resources/app_icon.ico
      - run: flutter pub get
      - run: bash tool/ci_run.sh 'Ошибка генерации кода' dart run build_runner build --delete-conflicting-outputs
      - name: Сборка Windows
        shell: bash
        run: tool/ci_run.sh 'Ошибка сборки Windows' flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: podcast_app-windows
          path: build/windows/x64/runner/Release/
